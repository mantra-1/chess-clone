<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play JebBot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e8e2d9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #2a2520;
            margin-bottom: 8px;
        }

        .header p {
            color: #5a5550;
            font-size: 14px;
        }

        /* Opponent selector */
        .opponent-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #5a5550;
        }

        .opponent-selector select {
            padding: 8px 14px;
            border: 2px solid #c9bfb0;
            border-radius: 6px;
            background: #f5f2ed;
            font-size: 14px;
            color: #2a2520;
            cursor: pointer;
            font-weight: 500;
        }

        .vs-label {
            font-weight: 600;
            color: #2a2520;
        }

        .jebbot-label {
            font-weight: 600;
            color: #5cb85c;
        }

        /* Board section */
        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #board {
            width: 400px;
        }

        /* Custom board colors */
        .board-b72b1 .white-1e1d7 {
            background-color: #ebe6de !important;
        }

        .board-b72b1 .black-3c85d {
            background-color: #c9bfb0 !important;
        }

        /* Highlight squares */
        .highlight-candidate {
            box-shadow: inset 0 0 0 4px rgba(92, 184, 92, 0.5) !important;
        }

        .highlight-selected {
            background-color: #8cc9a3 !important;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .control-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #5a5550;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease;
        }

        .control-btn:hover:not(:disabled) {
            background: #2a2520;
        }

        .control-btn:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
        }

        .control-btn.primary {
            background: #5cb85c;
        }

        .control-btn.primary:hover:not(:disabled) {
            background: #4a9a4a;
        }

        .control-btn.pause {
            background: #d9534f;
        }

        .control-btn.pause:hover {
            background: #c9302c;
        }

        /* Status */
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #5a5550;
            min-height: 20px;
        }

        .status.turn-player {
            color: #5cb85c;
            font-weight: 500;
        }

        .status.game-over {
            color: #d9534f;
            font-weight: 600;
        }

        /* Terminal-style analysis panel */
        .terminal-panel {
            margin-top: 16px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 13px;
            color: #4ade80;
            min-height: 180px;
        }

        .terminal-line {
            margin-bottom: 4px;
            white-space: pre;
        }

        .terminal-prompt {
            color: #9ca3af;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #6b7280;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .terminal-candidates {
            margin: 8px 0;
        }

        .candidate-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .candidate-num {
            width: 24px;
            color: #6b7280;
        }

        .candidate-move {
            width: 48px;
            color: #f9fafb;
            font-weight: 500;
        }

        .candidate-bar {
            width: 100px;
            color: #4ade80;
            letter-spacing: -1px;
        }

        .candidate-score {
            width: 36px;
            text-align: right;
            color: #9ca3af;
        }

        .candidate-selected {
            color: #fbbf24;
            margin-left: 8px;
        }

        .candidate-row.selected .candidate-move {
            color: #4ade80;
        }

        .candidate-row.selected .candidate-score {
            color: #4ade80;
        }

        .terminal-action {
            margin-top: 12px;
            color: #4ade80;
        }

        .terminal-thinking {
            color: #9ca3af;
        }

        .terminal-thinking::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .terminal-waiting {
            color: #6b7280;
            text-align: center;
            padding: 40px 0;
        }

        .terminal-book {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Play JebBot</h1>
            <p>A neural network that plays chess like Jeb</p>
        </div>

        <div class="opponent-selector">
            <select id="opponent">
                <option value="player">Player</option>
                <option value="stockfish">Stockfish</option>
            </select>
            <span class="vs-label">vs</span>
            <span class="jebbot-label">JebBot</span>
        </div>

        <div class="board-section">
            <div id="board"></div>
            <div class="controls">
                <button class="control-btn" id="flip-board">Flip Board</button>
                <button class="control-btn primary" id="start-btn">Start Game</button>
                <button class="control-btn" id="new-game">New Game</button>
            </div>
            <div class="status" id="status"></div>
        </div>

        <div class="terminal-panel" id="terminal">
            <div class="terminal-waiting">Start a game to see JebBot's analysis</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        // Game state
        let board = null;
        let game = new Chess();
        let opponent = 'player';  // 'player' or 'stockfish'
        let boardFlipped = false; // false = white on bottom, true = black on bottom
        let gameStarted = false;
        let isPlaying = false;    // For auto-play (stockfish mode)
        let autoPlayTimeout = null;
        let isThinking = false;

        // Initialize board
        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                orientation: 'white',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
            };
            board = Chessboard('board', config);
        }

        // Get the color the human/stockfish plays (bottom of board)
        function getPlayerColor() {
            return boardFlipped ? 'b' : 'w';
        }

        // Get move history as UCI strings
        function getMoveHistory() {
            const history = [];
            const moves = game.history({ verbose: true });
            for (const move of moves) {
                history.push(move.from + move.to + (move.promotion || ''));
            }
            return history;
        }

        // Check if it's the human player's turn
        function isPlayerTurn() {
            if (opponent !== 'player') return false;
            return game.turn() === getPlayerColor();
        }

        // Drag start handler
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (opponent !== 'player') return false;
            if (!gameStarted && getPlayerColor() === 'b') return false; // Must click Start if playing black

            if (!isPlayerTurn()) return false;

            // Can only move own pieces
            const pieceColor = piece.charAt(0);
            if (pieceColor !== game.turn()) return false;

            // Mark game as started on first move attempt
            if (!gameStarted) {
                gameStarted = true;
                updateFlipButton();
            }

            return true;
        }

        // Drop handler
        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            clearHighlights();

            // After player moves, JebBot responds
            if (!game.game_over()) {
                setTimeout(makeJebBotMove, 300);
            }
        }

        // Update board position after snap
        function onSnapEnd() {
            board.position(game.fen());
        }

        // Update game status
        function updateStatus() {
            let status = '';
            const statusEl = document.getElementById('status');

            if (game.game_over()) {
                if (game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? 'Black' : 'White';
                    status = `Checkmate! ${winner} wins!`;
                } else if (game.in_draw()) {
                    status = 'Draw!';
                } else {
                    status = 'Game over!';
                }
                statusEl.className = 'status game-over';
                stopAutoPlay();
            } else if (opponent === 'player') {
                if (isPlayerTurn()) {
                    status = 'Your turn';
                    statusEl.className = 'status turn-player';
                } else {
                    status = 'JebBot is thinking...';
                    statusEl.className = 'status';
                }
            } else {
                // Stockfish vs JebBot
                const player = game.turn() === getPlayerColor() ? 'Stockfish' : 'JebBot';
                status = `${player}'s turn`;
                statusEl.className = 'status';
            }

            statusEl.textContent = status;
        }

        // Make JebBot move
        async function makeJebBotMove() {
            if (game.game_over() || isThinking) return;

            isThinking = true;
            showThinking();

            try {
                const response = await fetch('/jebbot_move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fen: game.fen(), move_history: getMoveHistory() })
                });

                const data = await response.json();

                if (data.selected_move) {
                    showCandidates(data.candidates, data.selected_move, data.selection_reason);
                    highlightCandidates(data.candidates, data.selected_move);

                    game.move({
                        from: data.selected_move.substring(0, 2),
                        to: data.selected_move.substring(2, 4),
                        promotion: data.selected_move.length > 4 ? data.selected_move[4] : 'q'
                    });

                    board.position(game.fen());
                    updateStatus();

                    // Continue auto-play in stockfish mode
                    if (opponent === 'stockfish' && isPlaying && !game.game_over()) {
                        autoPlayTimeout = setTimeout(makeStockfishMove, 1000);
                    }
                }
            } catch (error) {
                console.error('Error getting JebBot move:', error);
            }

            isThinking = false;
        }

        // Make Stockfish move
        async function makeStockfishMove() {
            if (game.game_over() || isThinking) return;

            isThinking = true;

            try {
                const response = await fetch('/stockfish_move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fen: game.fen() })
                });

                const data = await response.json();

                if (data.move) {
                    clearHighlights();

                    game.move({
                        from: data.move.substring(0, 2),
                        to: data.move.substring(2, 4),
                        promotion: data.move.length > 4 ? data.move[4] : undefined
                    });

                    board.position(game.fen());
                    updateStatus();

                    // Continue auto-play
                    if (opponent === 'stockfish' && isPlaying && !game.game_over()) {
                        autoPlayTimeout = setTimeout(makeJebBotMove, 1000);
                    }
                }
            } catch (error) {
                console.error('Error getting Stockfish move:', error);
            }

            isThinking = false;
        }

        // Build progress bar from score
        function buildBar(score) {
            const filled = Math.round(score * 10);
            const empty = 10 - filled;
            return '\u2588'.repeat(filled) + '\u2591'.repeat(empty);
        }

        // Show thinking state in terminal
        function showThinking() {
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = `
                <div class="terminal-line terminal-thinking">&gt; JebBot analyzing position</div>
            `;
        }

        // Show candidates in terminal
        function showCandidates(candidates, selectedMove, selectionReason) {
            const terminal = document.getElementById('terminal');

            // Find selected move's algebraic notation
            const selected = candidates.find(c => c.move === selectedMove);
            const selectedAlgebraic = selected ? selected.algebraic : selectedMove;

            // Handle opening book move specially
            if (selectionReason === 'opening_book') {
                terminal.innerHTML = `
                    <div class="terminal-line"><span class="terminal-prompt">&gt;</span> <span class="terminal-book">Opening book</span></div>
                    <div class="terminal-candidates">
                        <div class="candidate-row selected">
                            <span class="candidate-num">1.</span>
                            <span class="candidate-move terminal-book">${selectedAlgebraic}</span>
                            <span class="candidate-bar">${buildBar(1.0)}</span>
                            <span class="candidate-score terminal-book">BOOK</span>
                        </div>
                    </div>
                    <div class="terminal-action"><span class="terminal-prompt">&gt;</span> <span class="terminal-book">Playing ${selectedAlgebraic}</span></div>
                `;
                return;
            }

            // Normal candidate display
            let reasonText = '';
            if (selectionReason === 'safe_pick') {
                reasonText = ' (safe pick)';
            } else if (selectionReason === 'strong_jeb_preference') {
                reasonText = ' (strong Jeb preference)';
            } else if (selectionReason === 'fallback') {
                reasonText = ' (fallback)';
            }

            let html = `
                <div class="terminal-line"><span class="terminal-prompt">&gt;</span> JebBot analyzing position...</div>
                <div class="terminal-header">
                    <span>Candidates:</span>
                    <span>Score:</span>
                </div>
                <div class="terminal-candidates">
            `;

            candidates.forEach((candidate, i) => {
                const isSelected = candidate.move === selectedMove;
                const scorePercent = Math.round(candidate.score * 100);
                const bar = buildBar(candidate.score);
                const selectedMarker = isSelected ? '<span class="candidate-selected">\u2190 SELECTED</span>' : '';

                html += `
                    <div class="candidate-row ${isSelected ? 'selected' : ''}">
                        <span class="candidate-num">${i + 1}.</span>
                        <span class="candidate-move">${candidate.algebraic}</span>
                        <span class="candidate-bar">${bar}</span>
                        <span class="candidate-score">${scorePercent}%</span>
                        ${selectedMarker}
                    </div>
                `;
            });

            html += `
                </div>
                <div class="terminal-action"><span class="terminal-prompt">&gt;</span> Playing ${selectedAlgebraic}${reasonText}</div>
            `;

            terminal.innerHTML = html;
        }

        // Highlight candidate squares on board
        function highlightCandidates(candidates, selectedMove) {
            clearHighlights();

            for (const candidate of candidates) {
                const toSquare = candidate.move.substring(2, 4);
                const squareEl = document.querySelector(`.square-${toSquare}`);
                if (squareEl) {
                    if (candidate.move === selectedMove) {
                        squareEl.classList.add('highlight-selected');
                    } else {
                        squareEl.classList.add('highlight-candidate');
                    }
                }
            }
        }

        // Clear highlights
        function clearHighlights() {
            document.querySelectorAll('.highlight-candidate, .highlight-selected').forEach(el => {
                el.classList.remove('highlight-candidate', 'highlight-selected');
            });
        }

        // Start game / auto-play
        function startGame() {
            if (game.game_over()) return;

            gameStarted = true;
            updateFlipButton();

            if (opponent === 'stockfish') {
                // Auto-play mode
                isPlaying = true;
                updateStartButton();

                // Determine who moves first based on board orientation
                // JebBot is always on top, so if board not flipped, JebBot plays black
                // Stockfish (on bottom) plays white if board not flipped
                if (getPlayerColor() === 'w') {
                    // Stockfish plays white, moves first
                    makeStockfishMove();
                } else {
                    // JebBot plays white, moves first
                    makeJebBotMove();
                }
            } else {
                // Player mode - JebBot needs to move first if player is black
                if (getPlayerColor() === 'b') {
                    makeJebBotMove();
                }
                updateStartButton();
            }
        }

        // Pause auto-play
        function pauseGame() {
            isPlaying = false;
            if (autoPlayTimeout) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            updateStartButton();
        }

        // Resume auto-play
        function resumeGame() {
            if (game.game_over()) return;

            isPlaying = true;
            updateStartButton();

            // Continue with whoever's turn it is
            if (game.turn() === getPlayerColor()) {
                makeStockfishMove();
            } else {
                makeJebBotMove();
            }
        }

        // Stop auto-play completely
        function stopAutoPlay() {
            isPlaying = false;
            if (autoPlayTimeout) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            updateStartButton();
        }

        // Handle start/pause/resume button click
        function handleStartButton() {
            if (!gameStarted) {
                startGame();
            } else if (opponent === 'stockfish') {
                if (isPlaying) {
                    pauseGame();
                } else {
                    resumeGame();
                }
            }
        }

        // Update start button state
        function updateStartButton() {
            const btn = document.getElementById('start-btn');

            if (!gameStarted) {
                btn.textContent = 'Start Game';
                btn.className = 'control-btn primary';
                btn.style.display = 'inline-block';
            } else if (opponent === 'stockfish') {
                if (isPlaying) {
                    btn.textContent = 'Pause';
                    btn.className = 'control-btn pause';
                    btn.style.display = 'inline-block';
                } else if (!game.game_over()) {
                    btn.textContent = 'Resume';
                    btn.className = 'control-btn primary';
                    btn.style.display = 'inline-block';
                } else {
                    btn.style.display = 'none';
                }
            } else {
                // Player mode after game started - hide button
                btn.style.display = 'none';
            }
        }

        // Update flip button state
        function updateFlipButton() {
            const btn = document.getElementById('flip-board');
            btn.disabled = gameStarted;
        }

        // Flip board
        function flipBoard() {
            if (gameStarted) return;

            boardFlipped = !boardFlipped;
            board.orientation(boardFlipped ? 'black' : 'white');
            updateTerminalMessage();
        }

        // Update terminal message based on current state
        function updateTerminalMessage() {
            const terminal = document.getElementById('terminal');
            const playerColor = getPlayerColor() === 'w' ? 'White' : 'Black';

            if (opponent === 'player') {
                if (getPlayerColor() === 'w') {
                    terminal.innerHTML = '<div class="terminal-waiting">Make your move to start the game</div>';
                } else {
                    terminal.innerHTML = '<div class="terminal-waiting">Click "Start Game" for JebBot to move first</div>';
                }
            } else {
                terminal.innerHTML = '<div class="terminal-waiting">Stockfish vs JebBot - Click "Start Game"</div>';
            }
        }

        // New game
        function newGame() {
            stopAutoPlay();
            game = new Chess();
            gameStarted = false;
            board.position('start');
            board.orientation(boardFlipped ? 'black' : 'white');
            clearHighlights();
            updateFlipButton();
            updateStartButton();
            updateTerminalMessage();
            updateStatus();
        }

        // Opponent change
        function setOpponent(value) {
            opponent = value;
            newGame();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initBoard();
            updateStatus();
            updateTerminalMessage();

            // Control buttons
            document.getElementById('flip-board').addEventListener('click', flipBoard);
            document.getElementById('start-btn').addEventListener('click', handleStartButton);
            document.getElementById('new-game').addEventListener('click', newGame);

            // Opponent selector
            document.getElementById('opponent').addEventListener('change', (e) => {
                setOpponent(e.target.value);
            });
        });
    </script>
</body>
</html>
