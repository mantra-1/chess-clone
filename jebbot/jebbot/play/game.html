<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play JebBot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e8e2d9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #2a2520;
            margin-bottom: 8px;
        }

        .header p {
            color: #5a5550;
            font-size: 14px;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #c9bfb0;
            border-radius: 6px;
            background: #f5f2ed;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #5a5550;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: #ebe6de;
        }

        .mode-btn.active {
            background: #5cb85c;
            border-color: #5cb85c;
            color: white;
        }

        /* Side selector */
        .side-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #5a5550;
        }

        .side-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .side-toggle select {
            padding: 6px 12px;
            border: 2px solid #c9bfb0;
            border-radius: 4px;
            background: #f5f2ed;
            font-size: 13px;
            color: #2a2520;
            cursor: pointer;
        }

        .vs-label {
            font-weight: 600;
            color: #2a2520;
        }

        .jebbot-label {
            font-weight: 600;
            color: #5cb85c;
        }

        /* Board section */
        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #board {
            width: 400px;
        }

        /* Custom board colors */
        .board-b72b1 .white-1e1d7 {
            background-color: #ebe6de !important;
        }

        .board-b72b1 .black-3c85d {
            background-color: #c9bfb0 !important;
        }

        /* Highlight squares */
        .highlight-candidate {
            box-shadow: inset 0 0 0 4px rgba(92, 184, 92, 0.5) !important;
        }

        .highlight-selected {
            background-color: #8cc9a3 !important;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .control-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #5a5550;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease;
        }

        .control-btn:hover {
            background: #2a2520;
        }

        .control-btn.playing {
            background: #d9534f;
        }

        .control-btn.playing:hover {
            background: #c9302c;
        }

        /* Status */
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #5a5550;
            min-height: 20px;
        }

        .status.turn-player {
            color: #5cb85c;
            font-weight: 500;
        }

        .status.game-over {
            color: #d9534f;
            font-weight: 600;
        }

        /* Terminal-style analysis panel */
        .terminal-panel {
            margin-top: 16px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 13px;
            color: #4ade80;
            min-height: 180px;
        }

        .terminal-line {
            margin-bottom: 4px;
            white-space: pre;
        }

        .terminal-prompt {
            color: #9ca3af;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #6b7280;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .terminal-candidates {
            margin: 8px 0;
        }

        .candidate-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .candidate-num {
            width: 24px;
            color: #6b7280;
        }

        .candidate-move {
            width: 48px;
            color: #f9fafb;
            font-weight: 500;
        }

        .candidate-bar {
            width: 100px;
            color: #4ade80;
            letter-spacing: -1px;
        }

        .candidate-score {
            width: 36px;
            text-align: right;
            color: #9ca3af;
        }

        .candidate-selected {
            color: #fbbf24;
            margin-left: 8px;
        }

        .candidate-row.selected .candidate-move {
            color: #4ade80;
        }

        .candidate-row.selected .candidate-score {
            color: #4ade80;
        }

        .terminal-action {
            margin-top: 12px;
            color: #4ade80;
        }

        .terminal-thinking {
            color: #9ca3af;
        }

        .terminal-thinking::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .terminal-waiting {
            color: #6b7280;
            text-align: center;
            padding: 40px 0;
        }

        .terminal-stockfish {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Play JebBot</h1>
            <p>A neural network that plays chess like Jeb</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="play">Play vs JebBot</button>
            <button class="mode-btn" data-mode="watch">JebBot vs Stockfish</button>
        </div>

        <div class="side-selector" id="side-selector">
            <div class="side-toggle">
                <select id="player-side">
                    <option value="player">Player</option>
                    <option value="stockfish">Stockfish</option>
                </select>
            </div>
            <span class="vs-label">vs</span>
            <span class="jebbot-label">JebBot</span>
        </div>

        <div class="board-section">
            <div id="board"></div>
            <div class="controls">
                <button class="control-btn" id="new-game">New Game</button>
                <button class="control-btn" id="start-pause" style="display: none;">Start</button>
            </div>
            <div class="status" id="status"></div>
        </div>

        <div class="terminal-panel" id="terminal">
            <div class="terminal-waiting">Start a game to see JebBot's analysis</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        // Game state
        let board = null;
        let game = new Chess();
        let gameMode = 'play';  // 'play' or 'watch'
        let playerSide = 'player';  // 'player' or 'stockfish'
        let isPlaying = false;  // For watch mode auto-play
        let autoPlayTimeout = null;
        let isThinking = false;

        // Initialize board
        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
            };
            board = Chessboard('board', config);
        }

        // Check if it's the human player's turn
        function isPlayerTurn() {
            if (gameMode !== 'play') return false;
            if (playerSide !== 'player') return false;
            // Player always plays white (bottom of board), JebBot plays black
            return game.turn() === 'w';
        }

        // Drag start handler
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;

            if (gameMode === 'play' && playerSide === 'player') {
                if (!isPlayerTurn()) return false;
                if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                    (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                    return false;
                }
                return true;
            }
            return false;
        }

        // Drop handler
        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            clearHighlights();

            // After player moves, JebBot responds
            if (!game.game_over()) {
                setTimeout(makeJebBotMove, 300);
            }
        }

        // Update board position after snap
        function onSnapEnd() {
            board.position(game.fen());
        }

        // Update game status
        function updateStatus() {
            let status = '';
            const turn = game.turn() === 'w' ? 'White' : 'Black';

            if (game.game_over()) {
                if (game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? 'Black' : 'White';
                    status = `Checkmate! ${winner} wins!`;
                } else if (game.in_draw()) {
                    status = 'Draw!';
                } else {
                    status = 'Game over!';
                }
                document.getElementById('status').className = 'status game-over';
                stopAutoPlay();
            } else {
                if (gameMode === 'play') {
                    if (isPlayerTurn()) {
                        status = 'Your turn';
                        document.getElementById('status').className = 'status turn-player';
                    } else {
                        status = 'JebBot is thinking...';
                        document.getElementById('status').className = 'status';
                    }
                } else {
                    const player = game.turn() === 'w' ? 'JebBot' : 'Stockfish';
                    status = `${player}'s turn`;
                    document.getElementById('status').className = 'status';
                }
            }

            document.getElementById('status').textContent = status;
        }

        // Make JebBot move
        async function makeJebBotMove() {
            if (game.game_over() || isThinking) return;

            isThinking = true;
            showThinking('JebBot');

            try {
                const response = await fetch('/jebbot_move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fen: game.fen() })
                });

                const data = await response.json();

                if (data.selected_move) {
                    showCandidates(data.candidates, data.selected_move);
                    highlightCandidates(data.candidates, data.selected_move);

                    const move = game.move({
                        from: data.selected_move.substring(0, 2),
                        to: data.selected_move.substring(2, 4),
                        promotion: data.selected_move.length > 4 ? data.selected_move[4] : 'q'
                    });

                    board.position(game.fen());
                    updateStatus();

                    // Continue auto-play in watch mode
                    if (gameMode === 'watch' && isPlaying && !game.game_over()) {
                        autoPlayTimeout = setTimeout(makeStockfishMove, 2000);
                    }
                }
            } catch (error) {
                console.error('Error getting JebBot move:', error);
            }

            isThinking = false;
        }

        // Make Stockfish move
        async function makeStockfishMove() {
            if (game.game_over() || isThinking) return;

            isThinking = true;
            showThinking('Stockfish');

            try {
                const response = await fetch('/stockfish_move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fen: game.fen() })
                });

                const data = await response.json();

                if (data.move) {
                    clearHighlights();
                    showStockfishMove(data.move);

                    const move = game.move({
                        from: data.move.substring(0, 2),
                        to: data.move.substring(2, 4),
                        promotion: data.move.length > 4 ? data.move[4] : 'q'
                    });

                    board.position(game.fen());
                    updateStatus();

                    // Continue auto-play in watch mode
                    if (gameMode === 'watch' && isPlaying && !game.game_over()) {
                        autoPlayTimeout = setTimeout(makeJebBotMove, 2000);
                    }
                }
            } catch (error) {
                console.error('Error getting Stockfish move:', error);
            }

            isThinking = false;
        }

        // Build progress bar from score
        function buildBar(score) {
            const filled = Math.round(score * 10);
            const empty = 10 - filled;
            return '\u2588'.repeat(filled) + '\u2591'.repeat(empty);
        }

        // Show thinking state in terminal
        function showThinking(player) {
            const terminal = document.getElementById('terminal');
            const cls = player === 'Stockfish' ? 'terminal-stockfish' : '';
            terminal.innerHTML = `
                <div class="terminal-line terminal-thinking ${cls}">&gt; ${player} analyzing position</div>
            `;
        }

        // Show candidates in terminal
        function showCandidates(candidates, selectedMove) {
            const terminal = document.getElementById('terminal');

            let html = `
                <div class="terminal-line"><span class="terminal-prompt">&gt;</span> JebBot analyzing position...</div>
                <div class="terminal-header">
                    <span>Candidates:</span>
                    <span>Score:</span>
                </div>
                <div class="terminal-candidates">
            `;

            candidates.forEach((candidate, i) => {
                const isSelected = candidate.move === selectedMove;
                const scorePercent = Math.round(candidate.score * 100);
                const bar = buildBar(candidate.score);
                const selectedMarker = isSelected ? '<span class="candidate-selected">\u2190 SELECTED</span>' : '';

                html += `
                    <div class="candidate-row ${isSelected ? 'selected' : ''}">
                        <span class="candidate-num">${i + 1}.</span>
                        <span class="candidate-move">${candidate.algebraic}</span>
                        <span class="candidate-bar">${bar}</span>
                        <span class="candidate-score">${scorePercent}%</span>
                        ${selectedMarker}
                    </div>
                `;
            });

            // Find selected move's algebraic notation
            const selected = candidates.find(c => c.move === selectedMove);
            const selectedAlgebraic = selected ? selected.algebraic : selectedMove;

            html += `
                </div>
                <div class="terminal-action"><span class="terminal-prompt">&gt;</span> Playing ${selectedAlgebraic}</div>
            `;

            terminal.innerHTML = html;
        }

        // Show Stockfish move in terminal
        function showStockfishMove(move) {
            const tempGame = new Chess(game.fen());
            let algebraic = move;
            try {
                const moveObj = tempGame.move({
                    from: move.substring(0, 2),
                    to: move.substring(2, 4),
                    promotion: move.length > 4 ? move[4] : undefined
                });
                if (moveObj) algebraic = moveObj.san;
            } catch (e) {}

            const terminal = document.getElementById('terminal');
            terminal.innerHTML = `
                <div class="terminal-line"><span class="terminal-prompt">&gt;</span> <span class="terminal-stockfish">Stockfish analyzing position...</span></div>
                <div class="terminal-header">
                    <span>Best Move:</span>
                    <span>ELO 1500</span>
                </div>
                <div class="terminal-candidates">
                    <div class="candidate-row selected">
                        <span class="candidate-num">1.</span>
                        <span class="candidate-move terminal-stockfish">${algebraic}</span>
                        <span class="candidate-bar">${buildBar(1.0)}</span>
                        <span class="candidate-score">-</span>
                    </div>
                </div>
                <div class="terminal-action"><span class="terminal-prompt">&gt;</span> <span class="terminal-stockfish">Playing ${algebraic}</span></div>
            `;
        }

        // Highlight candidate squares on board
        function highlightCandidates(candidates, selectedMove) {
            clearHighlights();

            for (const candidate of candidates) {
                const toSquare = candidate.move.substring(2, 4);
                const squareEl = document.querySelector(`.square-${toSquare}`);
                if (squareEl) {
                    if (candidate.move === selectedMove) {
                        squareEl.classList.add('highlight-selected');
                    } else {
                        squareEl.classList.add('highlight-candidate');
                    }
                }
            }
        }

        // Clear highlights
        function clearHighlights() {
            document.querySelectorAll('.highlight-candidate, .highlight-selected').forEach(el => {
                el.classList.remove('highlight-candidate', 'highlight-selected');
            });
        }

        // Start auto-play for watch mode
        function startAutoPlay() {
            if (game.game_over()) return;

            isPlaying = true;
            updateStartPauseButton();

            // JebBot plays white, start with JebBot
            if (game.turn() === 'w') {
                makeJebBotMove();
            } else {
                makeStockfishMove();
            }
        }

        // Stop auto-play
        function stopAutoPlay() {
            isPlaying = false;
            if (autoPlayTimeout) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            updateStartPauseButton();
        }

        // Toggle auto-play
        function toggleAutoPlay() {
            if (isPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        // Update start/pause button
        function updateStartPauseButton() {
            const btn = document.getElementById('start-pause');
            if (isPlaying) {
                btn.textContent = 'Pause';
                btn.classList.add('playing');
            } else {
                btn.textContent = 'Start';
                btn.classList.remove('playing');
            }
        }

        // New game
        function newGame() {
            stopAutoPlay();
            game = new Chess();
            board.start();
            clearHighlights();

            const terminal = document.getElementById('terminal');
            if (gameMode === 'play') {
                if (playerSide === 'player') {
                    terminal.innerHTML = '<div class="terminal-waiting">Your move! JebBot is waiting...</div>';
                } else {
                    terminal.innerHTML = '<div class="terminal-waiting">Stockfish vs JebBot - Click Start</div>';
                }
            } else {
                terminal.innerHTML = '<div class="terminal-waiting">JebBot vs Stockfish - Click Start</div>';
            }

            updateStatus();

            // In play mode with Stockfish playing white, start immediately
            if (gameMode === 'play' && playerSide === 'stockfish') {
                setTimeout(() => {
                    isPlaying = true;
                    updateStartPauseButton();
                    makeStockfishMove();
                }, 500);
            }
        }

        // Mode change
        function setMode(mode) {
            stopAutoPlay();
            gameMode = mode;

            // Update UI
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Show/hide side selector and start/pause button
            if (mode === 'play') {
                document.getElementById('side-selector').style.display = 'flex';
                document.getElementById('start-pause').style.display = playerSide === 'stockfish' ? 'inline-block' : 'none';
            } else {
                document.getElementById('side-selector').style.display = 'none';
                document.getElementById('start-pause').style.display = 'inline-block';
            }

            newGame();
        }

        // Player side change
        function setPlayerSide(side) {
            playerSide = side;

            // Show start/pause button if Stockfish is playing
            document.getElementById('start-pause').style.display = side === 'stockfish' ? 'inline-block' : 'none';

            newGame();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initBoard();
            updateStatus();

            // Mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            // Control buttons
            document.getElementById('new-game').addEventListener('click', newGame);
            document.getElementById('start-pause').addEventListener('click', toggleAutoPlay);

            // Player side selector
            document.getElementById('player-side').addEventListener('change', (e) => {
                setPlayerSide(e.target.value);
            });
        });
    </script>
</body>
</html>
